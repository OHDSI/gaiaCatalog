<!doctype html>
<html lang="en">
  <head>
    {%- block head -%}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="/static/css/style.css" rel="stylesheet">
    <title>{% block title %}{% endblock %}</title>
    {% endblock %}
  </head>
  <body>
    <div class="gdsc-header container-xxl mx-auto my-0" style="height: 80px;">
      <div class="row align-items-end">
        <div class="col-lg-5 bg-white"><a href="/"><img src="/static/img/OHDSI-banner.png" style="max-height: 80px"></a></div>
        <div class="col-lg-7 text-end d-flex flex-column">
          <a href="https://github.com/OHDSI/GIS" style="text-decoration: none;"><h3>OHDSI GIS Workgroup</h3></a>
          <a href="https://github.com/OHDSI/gaiaCatalog" style="text-decoration: none;"><h5>https://github.com/OHDSI/gaiaCatalog</h5></a>
        </div>
      </div>
    </div>
    <hr class="my-0">
    <div id="content" class="container-xxl mt-4 gdsc-content">
    {% block content %}
    {% endblock %}
    </div>
    <div id="footer" class="gdsc-footer container text-center mb-4 mt-2">
    {% block footer %}
      <hr>
      <span style="margin-left: -100px;">Powered by: <a href="https://gdsc.idsc.miami.edu" target="_blank">GDSC</a> - <a href="mailto:tnorris@miami.edu">contact</a><br></span>
    {% endblock %}
    </div>
    <div id="progressModal" class="modal">
      <div class="modal-dialog modal-dialog-centered progress-dialog">
      <div class="modal-content progress-content p-4">
        <h3>ETL Progress</h3>
        <div id="progressContent" class="progress-steps"></div>
        <form id="progressForm">
          <div class="modal-actions">
            <div id="progressSpinner" class="float-right yin-yang yin-yang-large"></div>
            <button type="button" class="btn btn-secondary" id="closeProgress">Close</button>
          </div>
        </form>
      </div></div>
    </div>
    <script src="/static/js/ohdsi.js"></script>
  </body>
</html>
