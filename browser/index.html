<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catalog Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container-fluid"></div>
  <!-- settings button -->
  <button id="settingsBtn" class="btn btn-md settings-btn" aria-label="Settings">⚙️</button>
  <!-- Settings modal (hidden by default) -->
  <div id="settingsModal" class="settings-modal hidden">
    <div class="settings-modal-content">
      <h3>PostgREST Endpoint</h3>
      <form id="pgEndpointForm">
        <label for="pgEndpointInput">Endpoint URL (e.g. https://my‑db.com/api/)</label>
        <input id="pgEndpointInput" type="url" placeholder="https://…/api/" required />
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" id="closeSettings">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
      const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
    });
  </script>
</body>
</html>
